[package]
name = "stencil"
version = "0.2.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
js-sys = { version = "0.3.106", optional = true }
napi = { version = "3.14.2", default-features = false, features = ["napi4", "serde-json"], optional = true }
napi-derive = { version = "3.6.12", optional = true }
serde_json = { version = "1.0.152", optional = true }
wasm-bindgen = { version = "0.2.129", optional = true }

[build-dependencies]
napi-build = { version = "2.6.0", optional = true }

[features]
# Addon Node.js: `npm run build`
node = ["dep:napi", "dep:napi-derive", "dep:serde_json", "dep:napi-build"]
# WebAssembly: `cargo build --release --target wasm32-unknown-unknown --features wasm`
wasm = ["dep:wasm-bindgen", "dep:js-sys", "dep:serde_json"]
