name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - run: cargo test
      # wasm-bindgen-cli must match the wasm-bindgen crate version in Cargo.lock.
      - id: wb
        run: echo "version=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ steps.wb.outputs.version }}
      - run: command -v wasm-bindgen || cargo install wasm-bindgen-cli --locked --version ${{ steps.wb.outputs.version }}
      - run: npm test
      - run: npm pack ./pkg
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: stencil-*.tgz
          if-no-files-found: error

  release:
    # On a tag like v0.3.0, attaches the package to a GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: package }
      - run: gh release create "$GITHUB_REF_NAME" stencil-*.tgz --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
